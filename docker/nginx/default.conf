server {
    listen 80;

    # Front Angular
    root /usr/share/nginx/html;
    index index.html;

    # Angular SPA
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Symfony API
    location /api {
        alias /var/www/backend/public;

        try_files $uri /index.php$is_args$args;

        location ~ ^/api/index\.php(/|$) {
            fastcgi_pass php:9000;
            include fastcgi_params;

            fastcgi_param SCRIPT_FILENAME /var/www/backend/public/index.php;
            fastcgi_param DOCUMENT_ROOT /var/www/backend/public;
        }
    }

    # PHP fallback
    location ~ \.php$ {
        fastcgi_pass php:9000;
        include fastcgi_params;

        fastcgi_param SCRIPT_FILENAME /var/www/backend/public$fastcgi_script_name;
        fastcgi_param DOCUMENT_ROOT /var/www/backend/public;
    }
}