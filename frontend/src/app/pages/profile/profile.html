<div class="card">
  <div class="text">
    <h1 class="card-title">Mon profil</h1>
  </div>

  @if (user) {
    <p><strong>Prénom :</strong> <span>{{ user.first_name }}</span></p>
    <p><strong>Nom :</strong> <span>{{ user.last_name }}</span></p>
    <p><strong>Email :</strong> <span>{{ user.email }}</span></p>

    <app-forms-profile [user]="user"></app-forms-profile>
  }
</div>
