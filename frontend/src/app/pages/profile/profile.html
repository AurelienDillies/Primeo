<div class="card">
  <div class="text">
    <h1 class="card-title">Mon profil</h1>
  </div>

  @if (user$ | async; as user) {
    <div class="info">
      <p class="name">Prénom : <span>{{ user.first_name }} </span></p>
      <p class="name">Nom : <span>{{ user.last_name }}</span></p>
      <p class="name">Email : <span>{{ user.email }}</span></p>
    </div>

    <app-forms-profile [user]="user"></app-forms-profile>
  }
</div>
