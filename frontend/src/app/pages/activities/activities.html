<div class="card">
    <div class="listing-header">
        @if (canEdit) {
        <button class="btn detail-action-button listing-add-button" type="button" routerLink="/nouvelle-activite">Ajouter une activité</button>
        } @else {
        <span aria-hidden="true"></span>
        }
        <h1 class="card-title">Sélection de l'activité</h1>
        <span aria-hidden="true"></span>
    </div>

    @if (vm$ | async; as vm) {
    <div class="container">
        @for (activity of vm.activities; track activity.id) {
        <app-activitie [activity]="activity"></app-activitie>
        }
        @if (!vm.activities.length) {
        <p>Aucune activité disponible pour le moment.</p>
        }
    </div>
    } @else {
    <p>Chargement des activités...</p>
    }

</div>
