<div class="card">
  <div class="text">
    <h1 class="card-title">Sélection de la classe</h1>
  </div>

  @if (vm$ | async; as vm) {

  <div class="container">
    @if (canCreateClass) {
    <button class="btn btn-create" routerLink="/nouvelle-classe">+</button>
    }
    @for (item of vm.classes; track item.id) {
    <app-classe [classe]="item"></app-classe>
    }
    @if (!vm.classes.length) {
        <p>Aucune classe disponible pour le moment.</p>
        }
  </div>

  }
</div>
