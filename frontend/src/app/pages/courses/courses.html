<div class="card">
    <div class="listing-header">
        @if (canEdit) {
        <button class="btn detail-action-button listing-add-button" type="button" routerLink="/nouveau-cours">Ajouter un cours</button>
        } @else {
        <span aria-hidden="true"></span>
        }
        <h1 class="card-title">Sélection du cours</h1>
        <span aria-hidden="true"></span>
    </div>

    @if (vm$ | async; as vm) {
    <div class="container">
        @for (course of vm.courses; track course.id) {
        <app-course [course]="course"></app-course>
        }
        @if (!vm.courses.length) {
        <p>Aucun cours disponible pour le moment.</p>
        }
    </div>
    } @else {
    <p>Chargement des cours...</p>
    }

</div>
