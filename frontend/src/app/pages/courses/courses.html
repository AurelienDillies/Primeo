<div class="card">
    <div class="text">
        <h1 class="card-title">Sélection du cours</h1>
    </div>

    @if (vm$ | async; as vm) {
    <div class="container">
        @if (canEdit) {
        <button class="btn btn-create" routerLink="/nouveau-cours">+</button>
        }
        @for (course of vm.courses; track course.id) {
        <app-course [course]="course"></app-course>
        }
        @if (!vm.courses.length) {
        <p>Aucun cours disponible pour le moment.</p>
        }
    </div>
    } @else {
    <p>Chargement des cours...</p>
    }

</div>
