<section class="card detail-page form-page">
	<div class="detail-header">
		<button class="btn" type="button" routerLink="/cours">Retour</button>
		<h1 class="card-title detail-title">Modifier le cours</h1>
		<div class="detail-header-spacer" aria-hidden="true"></div>
	</div>

	@if (loading()) { <p class="detail-note">Chargement du cours...</p> } @else {
	<div class="detail-grid">
		<div></div>
		<form class="detail-box detail-main-card" [formGroup]="form" (ngSubmit)="submit()">
			<div class="field"><label class="label" for="courseTitle">Titre</label><input class="input" id="courseTitle" formControlName="courseTitle"></div>
			<div class="field"><label class="label" for="courseDescription">Description</label><textarea class="input" id="courseDescription" formControlName="courseDescription"></textarea></div>
			<div class="field"><label class="label" for="classId">Classe associée</label><select class="input" id="classId" formControlName="classId"><option [ngValue]="null">Sélectionner une classe</option>@for (classe of classes$ | async; track classe.id) {<option [ngValue]="classe.id">{{ classe.className }}</option>}</select></div>
			<div class="field"><label class="label" for="courseResourcefile">PDF / document</label><input class="input" id="courseResourcefile" formControlName="courseResourcefile"></div>
			<div class="field"><label class="label" for="courseVideoUrl">Vidéo</label><input class="input" id="courseVideoUrl" formControlName="courseVideoUrl"></div>
			@if (errorMessage) { <p class="detail-note">{{ errorMessage }}</p> }
			<button class="btn detail-action-button" type="submit" [disabled]="saving">Enregistrer</button>
			<button class="btn btn-danger detail-action-button" type="button" (click)="deleteCourse()" [disabled]="saving || deleting">Supprimer le cours</button>
		</form>
		<div></div>
	</div>
	}
</section>
