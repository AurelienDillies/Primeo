<form class="form" action="#" method="">

	<div class="field">

		<label class="label" for="email">Email</label>
		<input class="input" id="email" type="email" name="email" autocomplete="email" placeholder="exemple@mail.com" required />

	</div>

	<div class="field">

		<label class="label" for="password">Mot de passe</label>
		<input class="input" id="password" type="password" name="password" autocomplete="new-password" placeholder="Mot de passe" required />

	</div>

	<button class="btn" type="submit">S'inscrire</button>

</form>
