<form class="form" action="#" method="post">
	<label class="field">
		<p class="label">Mail</p>
		<input type="email" name="email" autocomplete="email" placeholder="exemple@mail.com" required />
	</label>

	<label class="field">
		<p class="label">Mot de passe</p>
		<input type="password" name="password" autocomplete="new-password" placeholder="Mot de passe" required />
	</label>

	<button class="btn" type="submit">S'inscrire</button>
</form>
