<form class="form" (ngSubmit)="onSubmit()">

	<div class="field">

		<label class="label" for="email">Email</label>
		<input class="input" id="email" type="email" [(ngModel)]="email" name="email" autocomplete="email" placeholder="exemple@mail.com" required />

	</div>

	<div class="field">

		<label class="label" for="password">Mot de passe</label>
		<input class="input" id="password" type="password" [(ngModel)]="password" name="password" autocomplete="new-password" placeholder="Mot de passe" required />

	</div>

	<button class="btn" type="submit">S'inscrire</button>

</form>
