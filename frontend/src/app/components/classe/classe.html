<div class="card-container">

    <img class="card-img" src="/logo.png" alt="image">

    <h2 class="card-title title-card">{{ classe?.className ?? 'Classe sans nom' }}</h2>

    <div class="btn-action">
        @if (canEdit) {
        <button class="btn" routerLink="/modifier-classe">Modifier classe</button>
        }
        <button class="btn" routerLink="/resume-classes">Voir classe</button>

    </div>
</div>
