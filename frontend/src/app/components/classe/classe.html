<div class="card-container">

    <img class="card-img" src="/logo.png" alt="image">

    <h2 class="card-title title-card">{{Classe.className}}</h2>

    <div class="btn-action">
        @if (userService.hasAnyRole(rolesForChange)) {
        <button class="btn" routerLink="/cours">Modifier classe</button>
        }
        <button class="btn" routerLink="/resume-classes">Voir classe</button>

    </div>
</div>
