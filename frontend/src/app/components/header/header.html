<header class="site-header">
        <a class="brand" routerLink="/">
            <img src="/logo.png" alt="logo Digiforma" class="brand-logo">
            <p class="brand-name">Digiforma</p>
        </a>

        <nav class="main-nav" aria-label="Navigation principale">
            <a routerLink="/classes" routerLinkActive="current">Classes</a>
            <a routerLink="/cours" routerLinkActive="current">Cours</a>
            <a routerLink="/activites" routerLinkActive="current">Activités</a>
            <a routerLink="/suivi" routerLinkActive="current">Suivi</a>
            <a routerLink="/messagerie" routerLinkActive="current">Messages</a>
        </nav>

            <div class="profile-menu" [class.open]="isMenuOpen">
                <button
                    type="button"
                    class="profile-trigger"
                    aria-haspopup="menu"
                    [attr.aria-expanded]="isMenuOpen"
                    aria-controls="profile-menu"
                    (click)="toggleMenu($event)"
                >
                    <span class="sr-only">Menu utilisateur</span>
                    <i class="fa-solid fa-user profile-icon" aria-hidden="true"></i>
                </button>
                <div class="profile-dropdown card" id="profile-menu" role="menu">
                    <a role="menuitem" routerLink="/profil" (click)="closeMenu()">Profil</a>
                    <button type="button" role="menuitem" class="logout-item" (click)="logout()">
                        <span>Se déconnecter</span>
                    </button>
                </div>
            </div>

</header>
