    <form ngSubmit="onSubmit()" >
        <div>
            <label for="email">Email : </label>
            <input id="email" type="email" ngModel name="email" placeholder="Email" required>
        </div>
        <div>
            <label for="password">Password : </label>
            <input id="password" type="password" ngModel name="password" placeholder="Password" required>
        </div>
        <button type="submit">Login</button>
    </form>
