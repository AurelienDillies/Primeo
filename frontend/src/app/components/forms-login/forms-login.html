<form ngSubmit="onSubmit()">
  <div>
    <label for="email">Email : </label>
    <input id="email" type="email" ngModel name="email" placeholder="Email" required />
  </div>
  <div>
    <label for="password">Mot de passe : </label>
    <input id="password" type="password" ngModel name="password" placeholder="Mot de passe" required />
  </div>
  <button type="submit">Connexion</button>
</form>
