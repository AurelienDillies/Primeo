<form class="form" action="#" method="">

	<div class="field">

		<label class="label" for="firstname">Prénom</label>
		<input class="input" id="firstname" type="text" [(ngModel)]="firstname" name="firstname"
			autocomplete="given-name" placeholder="Jean" required />

	</div>

	<div class="field">

		<label class="label" for="lastname">Nom</label>
		<input class="input" id="lastname" type="text" [(ngModel)]="lastname" name="lastname" autocomplete="lastname"
			placeholder="Dupont" required />

	</div>

	<div class="field">

		<label class="label" for="email">Email</label>
		<input class="input" id="email" type="email" name="email" autocomplete="email" placeholder="exemple@mail.com"
			required />

	</div>

	<div class="field">

		<label class="label" for="password">Mot de passe</label>
		<input class="input" id="password" type="password" name="password" autocomplete="new-password"
			placeholder="Mot de passe" required />

	</div>

	<button class="btn" type="submit">Modifier</button>

</form>
