<form class="form" (ngSubmit)="onSubmit()">

	<div class="field">
		<label class="label" for="firstname">Prénom</label>
		<input class="input" id="firstname" type="text" [(ngModel)]="first_name" name="firstname" autocomplete="given-name" 
			placeholder="Jean" required />
	</div>

	<div class="field">
		<label class="label" for="lastname">Nom</label>
		<input class="input" id="lastname" type="text" [(ngModel)]="last_name" name="lastname" autocomplete="family-name"
			placeholder="Dupont" required />
	</div>

	<div class="field">
		<label class="label" for="email">Email</label>
		<input class="input" id="email" type="email" [(ngModel)]="email" name="email" autocomplete="email"
			placeholder="exemple@mail.com" required />
	</div>

	<div class="field">
		<label class="label" for="password">Mot de passe</label>
		<input class="input" id="password" type="password" [(ngModel)]="password" name="password" autocomplete="new-password" 
			placeholder="Nouveau mot de passe" />
	</div>

	<button class="btn" type="submit">
		Modifier
	</button>

</form>
